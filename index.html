<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doğrulama</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
  color:#202124;
}
.box{
  width:330px;
  padding:24px;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.captcha{
  display:flex;
  align-items:center;
  gap:14px;
  padding:18px;
  border:1px solid #d9d9d9;
  border-radius:4px;
  background:#fafafa;
  cursor:pointer;
  user-select:none;
}
.check{
  width:28px;
  height:28px;
  border:2px solid #777;
  border-radius:3px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 28px;
}
.loading{
  border:3px solid #ddd;
  border-top-color:#555;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
.done{
  border-color:#555;
  background:#555;
  color:white;
  font-size:19px;
  font-weight:bold;
}
.text{font-size:16px}
.result{
  display:none;
  text-align:center;
  margin-top:20px;
  font-size:18px;
  font-weight:600;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>
<div class="box">
  <div class="captcha" id="captcha">
    <div class="check" id="check"></div>
    <div class="text">Beren misiniz?</div>
  </div>

  <div class="result" id="result">
    Doğrulama başarılı
  </div>
</div>

<script>
const captcha=document.getElementById("captcha");
const check=document.getElementById("check");
const result=document.getElementById("result");

captcha.addEventListener("click",function(){
  if(check.classList.contains("loading") ||
     check.classList.contains("done")) return;

  check.classList.add("loading");

  setTimeout(function(){
    check.classList.remove("loading");
    check.classList.add("done");
    check.textContent="✓";
    result.style.display="block";
  },1800);
});
</script>
</body>
</html>
